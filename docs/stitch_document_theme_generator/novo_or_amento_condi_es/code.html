<body class="bg-surface text-on-surface h-screen flex flex-col font-sans">
<!-- Top App Bar -->
<header class="docked full-width top-0 bg-surface dark:bg-surface-dim border-b border-surface-outline flex justify-between items-center h-touch-target px-md w-full shrink-0">
<button class="flex items-center justify-center w-touch-target h-touch-target hover:bg-surface-container-high active:opacity-80 transition-opacity rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="close">close</span>
</button>
<span class="font-headline-md-mobile text-headline-md-mobile text-safety-amber dark:text-primary-fixed-dim font-bold">Obrion</span>
<div class="w-touch-target h-touch-target"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col overflow-y-auto pb-safe">
<!-- Step Indicator -->
<div class="bg-surface-container-low py-md px-md border-b border-surface-outline">
<div class="max-w-3xl mx-auto">
<div class="flex items-center justify-between relative">
<!-- Progress Line Background -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-surface-outline z-0"></div>
<!-- Progress Line Active -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-[2px] bg-primary z-0"></div>
<!-- Step 1 (Completed) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-title-md text-title-md shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="check">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Cliente</span>
</div>
<!-- Step 2 (Active) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-safety-amber text-white flex items-center justify-center font-title-md text-title-md shadow-sm outline outline-4 outline-surface-container-low">
                            2
                        </div>
<span class="font-label-md text-label-md text-safety-amber font-bold">Condições</span>
</div>
<!-- Step 3 (Pending) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-title-md text-title-md border border-surface-outline bg-surface">
                            3
                        </div>
<span class="font-label-md text-label-md text-on-surface-variant">Itens</span>
</div>
<!-- Step 4 (Pending) -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-title-md text-title-md border border-surface-outline bg-surface">
                            4
                        </div>
<span class="font-label-md text-label-md text-on-surface-variant">Revisão</span>
</div>
</div>
</div>
</div>
<!-- Form Section -->
<div class="flex-grow p-md max-w-3xl mx-auto w-full flex flex-col gap-lg mt-md">
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-sm">Detalhes da Obra</h1>
<div class="flex flex-col gap-md">
<!-- Descrição da obra -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="descricao">Descrição da obra *</label>
<textarea class="w-full min-h-[56px] bg-surface-container border-b-2 border-surface-outline focus:border-primary focus:ring-0 resize-none font-body-lg text-body-lg text-on-surface p-sm outline-none transition-colors" id="descricao" placeholder="Ex: Reforma da cozinha e banheiro..." rows="3"></textarea>
</div>
<!-- Observações -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="observacoes">Observações</label>
<textarea class="w-full min-h-[56px] bg-surface-container border-b-2 border-surface-outline focus:border-primary focus:ring-0 resize-none font-body-lg text-body-lg text-on-surface p-sm outline-none transition-colors" id="observacoes" placeholder="Informações adicionais para o cliente..." rows="2"></textarea>
</div>
<!-- Válido até -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface-variant" for="validade">Válido até *</label>
<div class="relative">
<input class="w-full h-[56px] bg-surface-container border-b-2 border-surface-outline focus:border-primary focus:ring-0 font-body-lg text-body-lg text-on-surface px-sm outline-none transition-colors w-full" id="validade" type="date"/>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar (Footer) -->
<footer class="bg-surface border-t border-surface-outline p-md flex gap-md justify-between shrink-0">
<button class="h-touch-target px-lg border border-primary text-primary font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-surface-container-high transition-colors w-1/2">
            Voltar
        </button>
<button class="h-touch-target px-lg bg-safety-amber text-white font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-primary transition-colors w-1/2 shadow-sm">
            Próximo
        </button>
</footer>
</body></html>
