name: Build & Distribute APK

on:
  push:
    branches: [main]

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # --release (não --debug): builds de debug do Flutter rodam com JIT +
      # asserções de debug, o que deixa qualquer animação (inclusive o
      # teclado abrindo) visivelmente mais lenta que num aparelho de
      # verdade — não é bug do app, é como o modo debug funciona. O tipo
      # de build "release" já está assinado com a chave de debug em
      # android/app/build.gradle.kts (Fase 1.5, sem infra de assinatura
      # de produção ainda), então funciona sem segredo novo.
      - name: Build release APK
        run: flutter build apk --release

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "teste-1" \
            --release-notes "Build automático do Obrion Orçamentos"